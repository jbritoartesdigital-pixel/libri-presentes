name: Publicar Libri Presentes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-libri-presentes
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrar D1 e publicar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply libri-presentes-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar no Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          wranglerVersion: "4.125.0"
          command: deploy --config wrangler.jsonc
